<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devina's Page</title>
    <!-- Mengimpor FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #130808;
            color: #a47b92;
        }

        /* Header / Navbar */
        header {
            background-color: #3a2737;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #f8f3c4; /* Warna keemasan teks logo */
        }

        nav a {
            color: #f8f3c4;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
            font-weight: bold;
        }

        nav a:hover {
            color: #b691b0;
        }

        nav a.active {
            color: #f8f3c4;
        }

        /* Konten Utama */
        .main-content {
            text-align: center;
            padding: 60px 20px;
        }

        .main-content h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 60px;
            text-transform: lowercase;
        }

        /* Grid Menu / Ikon */
        .menu-grid {
            display: flex;
            justify-content: center;
            gap: 80px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
        }

        .menu-item {
            text-align: center;
            text-decoration: none;
            color: #f8f3c4;
        }

        .menu-item i {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
        }

        .menu-item span {
            font-size: 18px;
            font-weight: bold;
        }

        .menu-item:hover {
            opacity: 0.7;
        }

        /* Tombol Scroll Up di Kanan Bawah */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #0099ff;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .scroll-top:hover {
            background-color: #007acc;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Devina's Page</div>
        <nav>
            <a href="#main-content" class="active">Home</a>
            <a href="tugas1.html">Tugas I</a>
            <a href="tugas2.html">Tugas II</a>
        </nav>
    </header>

    <!-- Konten -->
    <div class="#">
        <h1>sistem oprasi</h1>

        <div class="menu-grid">
            <!-- Menu Tugas I -->
            <a href="tugas1.html" class="menu-item">
                <i class="fa-solid fa-server"></i>
                <span>Tugas I</span>
            </a>

            <!-- Menu Tugas II -->
            <a href="tugas2.html" class="menu-item">
                <i class="fa-solid fa-server"></i>
                <span>Tugas II</span>
            </a>

            <!-- Menu User -->
            <a href="user.html" class="menu-item">
                <i class="fa-solid fa-user"></i>
                <span>User</span>
            </a>

            <!-- Menu DIVA -->
            <a href="#" class="menu-item">
                <i class="fa-solid fa-star"></i>
                <span>DIVA</span>
            </a>
        </div>
    </div>

    <!-- Tombol Ke Atas (Scroll Up) -->
    <a href="#" class="scroll-top">
        <i class="fa-solid fa-arrow-up"></i>
    </a>

</body>
</html>
